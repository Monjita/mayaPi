<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MayaPi{% endblock %}</title>

    <!-- FontAwesome local -->
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/vendor/fontawesome.min.css') }}"> -->
     <script src="{{ url_for('static', filename='js/vendor/fontawesome.min.js') }}"></script>
    <!-- Estilos principales -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    {% block head %}{% endblock %}
</head>
<body>

    <!-- ── Navbar ── -->
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="navbar__brand">
            <!-- <div class="navbar__brand-icon"> -->
                <!-- <i class="fa-solid fa-circle-nodes"></i> -->
            <div style="padding-top: 7px;">
                <svg class="mg__zero-svg" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 200 120" aria-label="cero maya">
                <!-- Contorno óvalo -->
                <ellipse cx="100" cy="60" rx="80" ry="35"
                    fill="none"
                    stroke="currentColor" stroke-width="8"
                    stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Curva central inferior -->
                <path d="M20 60 Q100 98 180 60"
                    fill="none"
                    stroke="currentColor" stroke-width="6"
                    stroke-linecap="round"/>
                <!-- Costilla izquierda -->
                <path d="M70 29.3 Q55 44.5 70 74"
                    fill="none"
                    stroke="currentColor" stroke-width="6"
                    stroke-linecap="round"/>
                <!-- Costilla central -->
                <path d="M100 25 Q85 44.5 100 76"
                    fill="none"
                    stroke="currentColor" stroke-width="6"
                    stroke-linecap="round"/>
                <!-- Costilla derecha -->
                <path d="M130 29.3 Q115 44.5 130 74"
                    fill="none"
                    stroke="currentColor" stroke-width="6"
                    stroke-linecap="round"/>
                </svg>
            </div>
            MayaPi
        </a>

        <ul class="navbar__nav">
            <li>
                <a href="{{ url_for('index') }}"
                   class="{% if request.endpoint == 'index' %}active{% endif %}">
                    <i class="fa-solid fa-clock"></i> Reloj
                </a>
            </li>
            <li>
                <a href="{{ url_for('config') }}"
                   class="{% if request.endpoint == 'config' %}active{% endif %}">
                    <i class="fa-solid fa-sliders"></i> Config
                </a>
            </li>
        </ul>

        <div class="navbar__actions">
            <span class="badge badge--jade">
                <i class="fab fa-raspberry-pi fa-2x"></i>
                <!-- <i class="fa-solid fa-circle" style="font-size:0.5rem"></i> Online -->
            </span>
        </div>
    </nav>

    <!-- ── Contenido ── -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <!-- Scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
