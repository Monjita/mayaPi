{% extends 'base.html' %}

{% block title %}Reloj Maya — MayaPi{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/maya-numerals.css') }}">
<style>
  /* Ajuste para pantalla 480×320 — sin scroll en el reloj */
  .clock-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 0 0.5rem;
  }
</style>
{% endblock %}

{% block content %}

<!-- ── Reloj principal ── -->
<div class="card">

    <div class="clock-wrapper">
        <div class="maya-clock">
            <div class="maya-clock__digits">

                <!-- Horas (0–23) -->
                <div class="maya-digit">
                    <div class="maya-digit__box">
                        <div id="d-h"></div>
                    </div>
                    <div class="maya-digit__label">Horas</div>
                </div>

                <div class="maya-clock__sep">:</div>

                <!-- Minutos (0–59) -->
                <div class="maya-digit">
                    <div class="maya-digit__box">
                        <div id="d-m"></div>
                    </div>
                    <div class="maya-digit__label">Min</div>
                </div>

                <div class="maya-clock__sep">:</div>

                <!-- Segundos (0–59) -->
                <div class="maya-digit">
                    <div class="maya-digit__box">
                        <div id="d-s"></div>
                    </div>
                    <div class="maya-digit__label">Seg</div>
                </div>

            </div>
        </div>
    </div>
</div>
